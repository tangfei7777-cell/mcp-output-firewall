name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Benchmark gate
        run: node lib/cli.js bench --fail-on-miss

      - name: Declarations are current
        run: |
          npm run types
          git diff --exit-code -- types/ \
            || (echo '::error::generated .d.ts files are stale — run `npm run types` and commit' && exit 1)
